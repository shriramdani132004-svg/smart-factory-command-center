<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Factory Command Center</title>
    <link rel="stylesheet" href="style.css?v=20260904063025">
</head>
<body>
    <header class="topbar">
        <h1>Smart Factory Command Center</h1>
        <div class="live-indicator">
            <span class="live-dot"></span> LIVE
            <span id="last-update" class="last-update">Last Update: --:--:--</span>
        </div>
    </header>

    <section class="kpi-grid">
        <div class="kpi-card"><span class="kpi-label">Total Machines</span><span id="kpi-total" class="kpi-value">0</span></div>
        <div class="kpi-card running"><span class="kpi-label">Running</span><span id="kpi-running" class="kpi-value">0</span></div>
        <div class="kpi-card idle"><span class="kpi-label">Idle</span><span id="kpi-idle" class="kpi-value">0</span></div>
        <div class="kpi-card fault"><span class="kpi-label">Fault</span><span id="kpi-fault" class="kpi-value">0</span></div>
        <div class="kpi-card offline"><span class="kpi-label">Offline</span><span id="kpi-offline" class="kpi-value">0</span></div>
        <div class="kpi-card alerts"><span class="kpi-label">Active Alerts</span><span id="kpi-alerts" class="kpi-value">0</span></div>
        <div class="kpi-card"><span class="kpi-label">Production Today</span><span id="kpi-production" class="kpi-value">0</span></div>
        <div class="kpi-card"><span class="kpi-label">Production Rate</span><span id="kpi-rate" class="kpi-value">0</span></div>
        <div class="kpi-card"><span class="kpi-label">Efficiency</span><span id="kpi-efficiency" class="kpi-value">0%</span></div>
        <div class="kpi-card"><span class="kpi-label">Energy</span><span id="kpi-energy" class="kpi-value">0 kWh</span></div>
        <div class="kpi-card"><span class="kpi-label">Active Orders</span><span id="kpi-orders" class="kpi-value">0</span></div>
    </section>

    <section class="floor-panel">
        <div class="floor-header">
            <h2>Live Factory Floor</h2>
            <div class="floor-controls">
                <input type="text" id="floor-search" placeholder="Search machine ID..." class="floor-input">
                <select id="filter-status" class="floor-select">
                    <option value="ALL">All Statuses</option>
                    <option value="RUNNING">Running</option>
                    <option value="WARNING">Warning</option>
                    <option value="MAINTENANCE">Maintenance</option>
                    <option value="FAULT">Fault</option>
                    <option value="OFFLINE">Offline</option>
                    <option value="IDLE">Idle</option>
                </select>
                <select id="filter-line" class="floor-select"><option value="ALL">All Lines</option></select>
                <select id="filter-type" class="floor-select"><option value="ALL">All Types</option></select>
            </div>
        </div>
        <div id="factory-floor" class="factory-floor"></div>
    </section>

    <section class="feed-panel">
        <h2>Live Event Feed</h2>
        <div id="event-feed" class="event-feed"></div>
    </section>

    <script src="js/config.js?v=20260904063025"></script>
    <script src="js/factory.js?v=20260904063025"></script>
    <script src="js/machine.js?v=20260904063025"></script>
    <script src="js/simulator.js?v=20260904063025"></script>
    <script src="js/state.js?v=20260904063025"></script>
    <script src="js/factoryFloor.js?v=20260904063025"></script>
    <script src="js/events.js?v=20260904063025"></script>
    <script src="js/controller.js?v=20260904063025"></script>
    <script src="js/alerts.js?v=20260904063025"></script>
    <script src="js/incidents.js?v=20260904063025"></script>
    <script src="js/automation.js?v=20260904063025"></script>
    <script src="js/production.js?v=20260904063025"></script>
    <script src="js/allocation.js?v=20260904063025"></script>
    <script src="js/maintenance.js?v=20260904063025"></script>
    <script src="js/analytics.js?v=20260904063025"></script>
    <script src="js/ai.js?v=20260904063025"></script>
    <script src="js/storage.js?v=20260904063025"></script>
    <script src="js/permissions.js?v=20260904063025"></script>
    <script src="js/audit.js?v=20260904063025"></script>
    <script src="js/machineDetail.js?v=20260904063025"></script>
    <script src="js/app.js?v=20260904063025"></script>
    <div id="detail-panel" class="detail-panel">
        <div class="detail-header">
            <h2 id="detail-title">Machine</h2>
            <button id="detail-close" class="detail-close-btn">X</button>
        </div>
        <span id="detail-status" class="status-badge">--</span>
        <div id="detail-body" class="detail-body"></div>
        <div class="control-buttons">
            <button id="btn-start" class="ctrl-btn ctrl-start">START</button>
            <button id="btn-stop" class="ctrl-btn ctrl-stop">STOP</button>
            <button id="btn-pause" class="ctrl-btn ctrl-pause">PAUSE</button>
            <button id="btn-resume" class="ctrl-btn ctrl-resume">RESUME</button>
            <button id="btn-reset" class="ctrl-btn ctrl-reset">RESET</button>
            <button id="btn-estop" class="ctrl-btn ctrl-estop">EMERGENCY STOP</button>
        </div>
    </div>

    <section class="audit-panel">
        <h2>Audit Log</h2>
        <div id="audit-log" class="audit-log"></div>
    </section>
</body>
</html>
